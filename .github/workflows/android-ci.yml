name: Android CI (GitHub Flow)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Модульные тесты и проверка сборки (Уралан: Нейрографист)
    runs-on: ubuntu-latest

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Установка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Кэширование зависимостей Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('src/android/**/*.gradle*', 'src/android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Загрузка офлайн-моделей и AAR-библиотек
        working-directory: src/android
        run: |
          chmod +x ./gradlew ./scripts/download_models.sh
          ./scripts/download_models.sh

      - name: Запуск модульных тестов (JUnit)
        working-directory: src/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Сборка релизного APK
        working-directory: src/android
        run: ./gradlew assembleRelease --no-daemon
